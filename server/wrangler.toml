# PokeTokenBar 실시간 배틀 중계 서버
#   로컬:  cd server && npm install && npm run dev    (http://127.0.0.1:8787)
#   배포:  npx wrangler login 후  npm run deploy
name = "poketokenbar-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 무료 요금제는 SQLite 저장소를 쓰는 Durable Object 만 된다. 저장은 하지 않지만 형식은 맞춘다
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
