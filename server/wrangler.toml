# PokeTokenBar 실시간 배틀 중계 서버
#   로컬:  cd server && npm install && npm run dev    (http://127.0.0.1:8787)
#   배포:  npx wrangler login 후  npm run deploy
name = "poketokenbar-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "GUILDS"
class_name = "Guild"

[[durable_objects.bindings]]
name = "WALLETS"
class_name = "Wallet"

# 무료 요금제는 SQLite 저장소를 쓰는 Durable Object 만 된다. Room 은 저장하지 않지만 형식은 맞춘다
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 길드 — 길드원의 방 사진을 저장한다
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Guild"]

# 코인 지갑 — 잔액을 서버가 들고 있다
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Wallet"]
