<!doctype html>
<meta charset="utf-8" />
<title>ball</title>
<style>
  /* 몬스터볼 하나짜리 투명 창. 잡고 휙 던진다 */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    display: grid; place-items: center; cursor: grab;
    user-select: none; -webkit-user-select: none;
    font: 800 10px/1 "Malgun Gothic", "Segoe UI", sans-serif;
  }
  body.dragging { cursor: grabbing; }
  #ball { width: 62%; height: 62%; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .5)); transform-origin: 50% 85%; }
  /* 기다리는 동안 살짝 흔들려서 "잡아 보라"고 알린다 */
  body.idle #ball { animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge { 0%, 70%, 100% { rotate: 0deg; } 78% { rotate: -14deg; } 86% { rotate: 12deg; } 94% { rotate: -6deg; } }
  body.fly #ball { animation: spin .35s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { rotate: 360deg; } }
  /* 포획 판정 — 원작처럼 좌우로 흔들린다 */
  #ball.shake { animation: shake .7s ease-in-out; }
  #ball.shake2 { animation: shake2 .7s ease-in-out; }
  @keyframes shake { 0%, 100% { rotate: 0deg; } 25% { rotate: -24deg; } 60% { rotate: 16deg; } }
  @keyframes shake2 { 0%, 100% { rotate: 0deg; } 25% { rotate: 24deg; } 60% { rotate: -16deg; } }
  #ball.open { animation: open .4s ease-out; }
  @keyframes open { 0% { scale: 1; } 40% { scale: 1.25; filter: brightness(2); } 100% { scale: 1; } }
  #ball.caught { filter: brightness(.8) drop-shadow(0 3px 4px rgba(0, 0, 0, .5)); }
  /* 볼 종류 — 위쪽 반구 색과 무늬만 바꾼다 */
  body[data-ball="great"] #top { fill: #3a7bd5; }
  body[data-ball="great"] .stripe { display: block; fill: #e3373b; }
  body[data-ball="ultra"] #top { fill: #2b2b33; }
  body[data-ball="ultra"] .hband { display: block; fill: #ffcb05; }
  .stripe, .hband { display: none; }
  /* 지금 던지면 잡힐 확률. 약하게 만들면 오른다 */
  #odds {
    position: fixed; left: 2px; top: 2px; padding: 1px 4px; border-radius: 6px;
    color: #fff; background: rgba(20, 21, 26, .8); font-size: 9px;
  }
  body.fly #odds, body.busy #odds { display: none; }
  #n {
    position: fixed; right: 4px; bottom: 4px; padding: 2px 5px; border-radius: 99px;
    color: #14151a; background: #ffcb05; box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }
  body.fly #n, body.busy #n { display: none; }
  #star { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; opacity: 0; }
  #star.on { animation: star 1.2s ease forwards; }
  @keyframes star { 0% { opacity: 0; scale: .4; } 25% { opacity: 1; scale: 1.2; } 100% { opacity: 0; scale: 1.6; translate: 0 -30%; } }
</style>
<svg id="ball" viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="50" cy="50" r="46" fill="#f2f3f5" stroke="#1b1c22" stroke-width="6" />
  <path id="top" d="M4 50 A46 46 0 0 1 96 50 Z" fill="#e3373b" stroke="#1b1c22" stroke-width="6" />
  <path class="stripe" d="M24 16 Q30 30 26 44 L34 44 Q38 28 32 12 Z M76 16 Q70 30 74 44 L66 44 Q62 28 68 12 Z" />
  <path class="hband" d="M20 20 L36 44 L28 44 L14 26 Z M80 20 L64 44 L72 44 L86 26 Z" />
  <rect x="4" y="46" width="92" height="8" fill="#1b1c22" />
  <circle cx="50" cy="50" r="13" fill="#f2f3f5" stroke="#1b1c22" stroke-width="6" />
  <circle cx="50" cy="50" r="5" fill="#f2f3f5" stroke="#1b1c22" stroke-width="3" />
  <path d="M22 26 Q30 16 42 14" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".55" />
</svg>
<div id="n"></div>
<div id="odds"></div>
<div id="star">✨</div>
<script src="ball.js"></script>
