<!doctype html>
<meta charset="utf-8" />
<title>pet</title>
<style>
  /* 투명 창이라 배경을 절대 칠하지 않는다. 칠하면 검은 사각형이 남는다. */
  html,
  body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  /* -webkit-app-region: drag 를 쓰지 않는다.
     그걸 쓰면 창은 끌리지만 클릭 이벤트가 JS로 오지 않아
     "눌러서 팝오버 열기"를 만들 수 없다. 드래그는 직접 구현한다. */
  body.dragging {
    cursor: grabbing;
  }
  #pet {
    image-rendering: pixelated;
    /* 스프라이트 원본이 96x96이다. max-width로는 그보다 크게 만들 수 없다 —
       max-*는 줄이기만 하고 늘리지 않는다. 실제 width/height를 준다.
       object-fit: contain 으로 정사각형이 아닌 스프라이트도 비율을 지킨다. */
    width: 112px;
    height: 112px;
    object-fit: contain;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45));
    transition: transform 0.2s ease;
    animation: bob 2.6s ease-in-out infinite;
    pointer-events: none; /* 이미지가 마우스 이벤트를 먹지 않게 */
  }
  /* GIF 자체도 움직이지만, 위아래로 살짝 떠 있으면 살아있는 느낌이 커진다 */
  @keyframes bob {
    0%,
    100% {
      translate: 0 0;
    }
    50% {
      translate: 0 -5px;
    }
  }
  #pet.left {
    transform: scaleX(-1);
  }
  #egg {
    animation: bob 2.6s ease-in-out infinite;
    pointer-events: none;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .45));
  }
  #egg svg { display: block; }

  /* ---- 기술 연출 (moves.js) ----
     몸을 움직이는 건 감싼 #body 다. #pet 에 transform 을 걸면 좌우 뒤집기
     (scaleX(-1))와 bob 이 같은 속성을 두고 싸운다. */
  #body {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
  }
  /* 물리 — 움츠렸다가 앞으로 두 번 들이받는다. --dir 이 앞쪽(-1 왼쪽, 1 오른쪽).
     창이 펫 크기만 해서 멀리 못 나간다. 거리 대신 횟수와 떨림으로 세게 보이게 한다 */
  .mv-lunge { animation: lunge 1.2s cubic-bezier(.3, 0, .3, 1); }
  @keyframes lunge {
    0% { transform: translateX(0) scale(1); }
    15% { transform: translateX(calc(var(--dir) * -7%)) scale(.94, 1.04); }
    22% { transform: translateX(calc(var(--dir) * 13%)) scale(1.06, .96); filter: brightness(1.5); }
    27% { transform: translateX(calc(var(--dir) * 10%)) translateY(-2%); }
    32% { transform: translateX(calc(var(--dir) * 12%)) translateY(1%); }
    45% { transform: translateX(calc(var(--dir) * -4%)); filter: none; }
    62% { transform: translateX(calc(var(--dir) * 13%)) scale(1.06, .96); filter: brightness(1.5); }
    68% { transform: translateX(calc(var(--dir) * 10%)) translateY(-2%); }
    74% { transform: translateX(calc(var(--dir) * 12%)); }
    100% { transform: translateX(0) scale(1); filter: none; }
  }
  /* 특수 — 타입 색으로 빛나며 떨다가 쏘는 순간 뒤로 밀린다 */
  .mv-charge { animation: charge 1.5s ease-out; }
  @keyframes charge {
    0%, 100% { transform: translate(0, 0); filter: none; }
    8%, 18%, 28% { transform: translate(-2.5%, 0); filter: brightness(1.3) drop-shadow(0 0 4px var(--glow)); }
    13%, 23% { transform: translate(2.5%, 0); filter: brightness(1.5) drop-shadow(0 0 7px var(--glow)); }
    32% { transform: translate(0, 0) scale(1.05); filter: brightness(1.8) drop-shadow(0 0 10px var(--glow)); }
    40%, 70% { transform: translate(calc(var(--dir) * -6%), 0); filter: brightness(1.4) drop-shadow(0 0 8px var(--glow)); }
  }
  /* 변화 — 두 번 부풀며 타입 색으로 번쩍인다 */
  .mv-pulse { animation: pulse 1.4s ease-in-out; transform-origin: 50% 100%; }
  @keyframes pulse {
    0%, 50%, 100% { transform: scale(1); filter: none; }
    22%, 72% { transform: scale(1.12); filter: brightness(1.7) saturate(1.3) drop-shadow(0 0 9px var(--glow)); }
  }
  /* 분신 — 좌우로 잔상을 남기며 깜빡인다 */
  .mv-clone { animation: clone 1.2s steps(1, end); }
  @keyframes clone {
    0%, 100% { transform: none; opacity: 1; }
    10% { transform: translateX(-14%); opacity: .5; }
    20% { transform: translateX(12%); opacity: .7; }
    30% { transform: translateX(-8%); opacity: .4; }
    40% { transform: none; opacity: .9; }
    55% { transform: translateX(10%); opacity: .5; }
    70% { transform: translateX(-12%); opacity: .6; }
  }
  /* 잠 — 천천히 기울며 꾸벅인다 */
  .mv-sleep { animation: doze 1.8s ease-in-out; transform-origin: 50% 100%; }
  @keyframes doze {
    0%, 100% { transform: rotate(0); }
    30%, 70% { transform: rotate(calc(var(--dir) * -8deg)) translateY(3%); filter: brightness(.85); }
  }
  /* 창 전체 흔들림 — 위력 100 이상, 대폭발 */
  body.shake { animation: shake .45s linear; }
  @keyframes shake {
    0%, 100% { transform: none; }
    20% { transform: translate(-3px, 1px); }
    40% { transform: translate(3px, -2px); }
    60% { transform: translate(-2px, 2px); }
    80% { transform: translate(2px, -1px); }
  }
  /* 지진 — 길게, 위아래로 */
  body.quake { animation: quake 1.05s linear; }
  @keyframes quake {
    0%, 100% { transform: none; }
    10%, 30%, 50%, 70%, 90% { transform: translate(-3px, 3px); }
    20%, 40%, 60%, 80% { transform: translate(3px, -2px); }
  }
  #fx {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  /* 기술 이름. 창이 펫 크기만 해서 머리 위 여백에 겨우 들어간다 */
  #moveTag {
    position: fixed;
    top: 2px;
    left: 50%;
    max-width: calc(100% - 8px);
    padding: 1px 7px;
    border-radius: 999px;
    color: #fff;
    font: 700 11px/1.5 "Malgun Gothic", "Segoe UI", sans-serif;
    text-shadow: 0 1px 1px rgba(0, 0, 0, .45);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 4px);
  }
  #moveTag.on { animation: tag 3s ease forwards; }
  @keyframes tag {
    0% { opacity: 0; transform: translate(-50%, 4px); }
    8%, 85% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -3px); }
  }
</style>
<div id="body">
  <img id="pet" alt="" hidden />
  <div id="egg"></div>
</div>
<script src="egg.js"></script>
<script src="moves.js"></script>
<script src="pet.js"></script>
