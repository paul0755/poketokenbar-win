<!doctype html>
<meta charset="utf-8" />
<title>pet</title>
<link rel="stylesheet" href="moves.css" />
<link rel="stylesheet" href="digifx.css" />
<link rel="stylesheet" href="duel.css" />
<style>
  /* 투명 창이라 배경을 절대 칠하지 않는다. 칠하면 검은 사각형이 남는다. */
  html,
  body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  /* -webkit-app-region: drag 를 쓰지 않는다.
     그걸 쓰면 창은 끌리지만 클릭 이벤트가 JS로 오지 않아
     "눌러서 팝오버 열기"를 만들 수 없다. 드래그는 직접 구현한다. */
  body.dragging {
    cursor: grabbing;
  }
  #pet {
    image-rendering: pixelated;
    /* 스프라이트 원본이 96x96이다. max-width로는 그보다 크게 만들 수 없다 —
       max-*는 줄이기만 하고 늘리지 않는다. 실제 width/height를 준다.
       object-fit: contain 으로 정사각형이 아닌 스프라이트도 비율을 지킨다. */
    width: 112px;
    height: 112px;
    object-fit: contain;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45));
    transition: transform 0.2s ease;
    animation: bob 2.6s ease-in-out infinite;
    pointer-events: none; /* 이미지가 마우스 이벤트를 먹지 않게 */
  }
  /* GIF 자체도 움직이지만, 위아래로 살짝 떠 있으면 살아있는 느낌이 커진다 */
  @keyframes bob {
    0%,
    100% {
      translate: 0 0;
    }
    50% {
      translate: 0 -5px;
    }
  }
  #pet.left {
    transform: scaleX(-1);
  }
  /* 💎 메가진화 — 3D 그림(Showdown)은 도트가 아니고, 가로세로 비율이 제각각이다(메가보스만다 217x71,
     메가레쿠쟈 137x146). 창(정사각형) 전체를 쓰되 위로는 bob(5px)이 뜰 자리를 남긴다.
     예전엔 scale 1.14 로 키워서 키 큰 메가 26종이 bob 꼭대기에서 머리 5px 이 잘렸다.
     창 크기 기준이라 vw · vh — #body 는 내용 크기라 % 가 안 먹는다. pet.js 가 넣는 px 보다 앞서야 해서 !important */
  #pet.mega {
    image-rendering: auto;
    width: calc(100vw - 6px) !important;
    height: calc(100vh - 7px) !important;
    /* 가로로 넓은 메가(메가보스만다 · 메가피죤투 · 메가라티아스)는 창 폭에 묶여 원래 모습의 절반만 해진다.
       pet.js megaFit 이 비율만큼 살짝(최대 1.2배) 키운다 — 바닥 가운데 기준이라 날개 끝만 조금 창 밖으로 나간다 */
    scale: var(--mgs, 1);
    transform-origin: 50% 100%;
    filter: drop-shadow(0 0 3px rgba(255, 190, 255, 0.7)) drop-shadow(0 3px 4px rgba(0, 0, 0, 0.45));
  }
  #egg {
    animation: bob 2.6s ease-in-out infinite;
    pointer-events: none;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .45));
  }
  #egg svg { display: block; }


  /* ---- 기술 연출 (moves.js · moves.css) ----
     몸을 움직이는 건 감싼 #body 다. #pet 에 transform 을 걸면 좌우 뒤집기
     (scaleX(-1))와 bob 이 같은 속성을 두고 싸운다. */
  #body {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
  }
</style>
<div id="body">
  <img id="pet" alt="" hidden />
  <div id="egg"></div>
</div>
<script src="egg.js"></script>
<script src="moves.js"></script>
<script src="digifx.js"></script>
<script src="duel.js"></script>
<script src="pet.js"></script>
