<!doctype html>
<meta charset="utf-8" />
<title>상점</title>
<style>
  :root {
    --bg: #14151a; --card: #1e2027; --line: #2c2f38;
    --text: #f2f3f5; --muted: #9aa0ab; --dim: #6b6b78; --accent: #ffcb05;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column;
  }
  header {
    padding: 13px 16px 11px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    -webkit-app-region: drag;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 700; }
  .wallet {
    font-size: 12px; color: var(--accent); font-weight: 700;
    background: #2a2016; border: 1px solid #4a3a16; border-radius: 99px; padding: 2px 10px;
  }
  .spacer { flex: 1; }
  .close {
    width: 28px; height: 28px; padding: 0; font-size: 14px; color: var(--muted);
    background: transparent; border: 0; border-radius: 8px; cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .close:hover { background: var(--card); color: var(--text); }

  .scroll { flex: 1; overflow-y: auto; padding: 10px 16px 18px; min-height: 0; }
  .scroll::-webkit-scrollbar { width: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: #33363f; border-radius: 99px; }

  .earn { font-size: 10px; color: var(--dim); line-height: 1.55; margin-bottom: 12px; }
  .earn b { color: var(--muted); }

  .item {
    display: flex; align-items: center; gap: 11px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px; margin-bottom: 8px;
  }
  .item .ic { font-size: 24px; width: 30px; text-align: center; flex-shrink: 0; }
  .item .body { flex: 1; min-width: 0; }
  .item .nm { font-size: 12.5px; font-weight: 700; }
  .item .de { font-size: 10.5px; color: var(--dim); margin-top: 1px; }
  .item button {
    flex-shrink: 0; min-width: 62px; padding: 6px 10px;
    font: inherit; font-size: 11px; font-weight: 700; color: #14151a;
    background: var(--accent); border: 0; border-radius: 8px; cursor: pointer;
  }
  .item button:hover { background: #ffd83d; }
  .item button:active { transform: scale(.96); }
  .item button:disabled { background: #33363f; color: var(--dim); cursor: default; transform: none; }
  .item.owned { opacity: .6; }

  #toast {
    position: fixed; left: 16px; right: 16px; bottom: 14px;
    background: #26303a; border: 1px solid #3a4a58; border-radius: 10px;
    padding: 9px 12px; font-size: 11.5px; text-align: center;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #toast.bad { background: #3a2626; border-color: #5a3434; }
  #toast.shiny { background: #3a2f16; border-color: #6a5420; color: var(--accent); }
</style>

<header>
  <h1>상점</h1>
  <span class="wallet" id="wallet">🍬 –</span>
  <span class="spacer"></span>
  <button class="close" id="close" title="닫기 (Esc)">✕</button>
</header>

<div class="scroll">
  <div class="earn" id="earn"></div>
  <div id="items"></div>
</div>

<div id="toast"></div>

<script src="shop.js"></script>
