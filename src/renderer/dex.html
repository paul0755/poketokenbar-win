<!doctype html>
<meta charset="utf-8" />
<title>도감</title>
<style>
  :root {
    --bg: #14151a; --card: #1e2027; --line: #2c2f38;
    --text: #f2f3f5; --muted: #9aa0ab; --dim: #6b6b78; --accent: #ffcb05;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column;
  }

  header {
    padding: 13px 16px 11px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    -webkit-app-region: drag; /* 프레임이 없으니 헤더를 잡아 옮긴다 */
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 700; }
  header .count { font-size: 11px; color: var(--muted); }
  header .count b { color: var(--accent); }
  .spacer { flex: 1; }
  .btns { display: flex; gap: 6px; -webkit-app-region: no-drag; }
  button {
    padding: 5px 10px; font: inherit; font-size: 11px; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #262a33; }
  button.on { border-color: var(--accent); color: var(--accent); }

  .scroll { flex: 1; overflow-y: auto; padding: 12px 14px 16px; min-height: 0; }
  .scroll::-webkit-scrollbar { width: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: #33363f; border-radius: 99px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .cell {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 4px 7px; text-align: center; min-height: 92px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .cell img { width: 48px; height: 48px; image-rendering: pixelated; }
  .cell .nm {
    margin-top: 3px; font-size: 10px; font-weight: 600; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cell .st { font-size: 9px; color: var(--accent); letter-spacing: .5px; }
  .cell .st .off { color: #3a3d46; }

  /* 안 만난 종은 실루엣도 안 보여준다 — 뭘 못 만났는지는 번호로만 안다 */
  .cell.locked { opacity: .5; }
  .cell.locked .q { font-size: 26px; color: var(--dim); }
  .cell.locked .nm { color: var(--dim); }

  .cell.grad { border-color: #4ade9b; }
  .badge {
    position: relative; top: -2px; font-size: 8.5px; color: #4ade9b;
  }
  .wip { position: relative; top: -2px; font-size: 8.5px; color: var(--dim); }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); font-size: 12px; }
</style>

<header>
  <h1>도감</h1>
  <span class="count" id="count">…</span>
  <span class="spacer"></span>
  <div class="btns">
    <button id="fAll" class="on">전체</button>
    <button id="fGot">모은 것</button>
    <button id="close">✕</button>
  </div>
</header>

<div class="scroll"><div class="grid" id="grid"></div></div>

<script src="dex.js"></script>
